<div class="admin-panel">
  <h2>Manage Users</h2>

  @if (isLoading()) {
    <p>Loading users...</p>
  } @else {
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (u of users(); track u._id) {
          <tr>
            <td>{{ u.FirstName }} {{ u.LastName }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.role }}</td>
            <td>
              <span class="badge" [class.blocked]="u.status === 'Blocked'">
                {{ u.status === 'Blocked' ? 'Blocked' : 'Active' }}
              </span>
            </td>
            <td>
              @if (u.role !== 'Admin') {
                <button
                  class="btn"
                  [class.unblock-btn]="u.status === 'Blocked'"
                  [class.block-btn]="u.status !== 'Blocked'"
                  [disabled]="processingId() === u._id"
                  (click)="toggleBlock(u)"
                >
                  {{ processingId() === u._id ? '...' : u.status === 'Blocked' ? 'Unblock' : 'Block' }}
                </button>
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
