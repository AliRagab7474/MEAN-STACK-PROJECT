<div class="auth-container">
  <div class="auth-card">
    <h2>Reset Password</h2>
    <p>Enter your email, the OTP you received, and a new password.</p>
    @if (errorMessage) { <div class="error-message">{{ errorMessage }}</div> }
    @if (successMessage) { <div class="success-message">{{ successMessage }}</div> }

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" formControlName="email" placeholder="example@mail.com"
          [class.is-invalid]="resetForm.get('email')?.invalid && resetForm.get('email')?.touched">
      </div>
      <div class="form-group">
        <label for="otp">Activation Code (OTP)</label>
        <input type="text" id="otp" formControlName="otp" placeholder="Enter code" style="text-align: center; letter-spacing: 2px;"
          [class.is-invalid]="resetForm.get('otp')?.invalid && resetForm.get('otp')?.touched">
      </div>
      <div class="form-row">
        <div class="form-group half-width">
          <label for="password">New Password</label>
          <input type="password" id="password" formControlName="password" placeholder="Password"
            [class.is-invalid]="resetForm.get('password')?.invalid && resetForm.get('password')?.touched">
        </div>
        <div class="form-group half-width">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="Confirm Password"
            [class.is-invalid]="resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched">
        </div>
      </div>
      @if (resetForm.hasError('passwordMismatch') && resetForm.get('confirmPassword')?.touched) {
        <small class="error-text mb-15">Passwords do not match!</small>
      }
      <button type="submit" [disabled]="isLoading || resetForm.invalid">
        {{ isLoading ? 'Saving...' : 'Save & Login' }}
      </button>
    </form>
    <div class="auth-link">
      <a routerLink="/login">Back to Login</a>
    </div>
  </div>
</div>
