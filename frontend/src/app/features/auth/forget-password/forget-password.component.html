<div class="auth-container">
  <div class="auth-card">
    <h2>Forgot Password?</h2>
    <p>Enter your email and we will send an OTP to reset your password.</p>
    @if (errorMessage) { <div class="error-message">{{ errorMessage }}</div> }
    @if (successMessage) { <div class="success-message">{{ successMessage }}</div> }

    <form [formGroup]="forgetForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" formControlName="email" placeholder="Enter your email here"
          [class.is-invalid]="forgetForm.get('email')?.invalid && forgetForm.get('email')?.touched">
      </div>
      <button type="submit" [disabled]="isLoading || forgetForm.invalid">
        {{ isLoading ? 'Sending...' : 'Send Code' }}
      </button>
    </form>
    <div class="auth-link">
      <a routerLink="/login">Back to Login</a>
    </div>
  </div>
</div>
