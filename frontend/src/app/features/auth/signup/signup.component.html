<div class="auth-container">
  <div class="auth-card" style="max-width: 500px;">
    <h2>Create New Account</h2>
    <p>Join us now to access all features</p>
    @if (errorMessage) { <div class="error-message">{{ errorMessage }}</div> }
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" formControlName="fullName" placeholder="Enter your full name"
          [class.is-invalid]="signupForm.get('fullName')?.invalid && signupForm.get('fullName')?.touched">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" formControlName="email" placeholder="example@mail.com"
          [class.is-invalid]="signupForm.get('email')?.invalid && signupForm.get('email')?.touched">
      </div>
      <div class="form-row">
        <div class="form-group half-width">
          <label for="phone">Phone Number</label>
          <input type="text" id="phone" formControlName="phone" placeholder="01xxxxxxxxx"
            [class.is-invalid]="signupForm.get('phone')?.invalid && signupForm.get('phone')?.touched">
        </div>
        <div class="form-group half-width">
          <label for="age">Age</label>
          <input type="number" id="age" formControlName="age" placeholder="e.g. 25"
            [class.is-invalid]="signupForm.get('age')?.invalid && signupForm.get('age')?.touched">
        </div>
      </div>
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" formControlName="gender" 
          [class.is-invalid]="signupForm.get('gender')?.invalid && signupForm.get('gender')?.touched">
          <option value="" disabled selected>Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group half-width">
          <label for="password">Password</label>
          <input type="password" id="password" formControlName="password" placeholder="Password"
            [class.is-invalid]="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
        </div>
        <div class="form-group half-width">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="Confirm Password"
            [class.is-invalid]="signupForm.get('confirmPassword')?.invalid && signupForm.get('confirmPassword')?.touched">
        </div>
      </div>
      @if (signupForm.hasError('passwordMismatch') && signupForm.get('confirmPassword')?.touched) {
        <small class="error-text mb-15">Passwords do not match!</small>
      }
      <button type="submit" [disabled]="isLoading || signupForm.invalid">
        {{ isLoading ? 'Registering...' : 'Create Account' }}
      </button>
    </form>
    <div class="auth-link">
      Already have an account? <a routerLink="/login">Login</a>
    </div>
  </div>
</div>
